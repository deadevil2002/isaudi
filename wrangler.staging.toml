name = "isaudi-staging"
account_id = "e8ae8afc6a6708283d6b0b4534f7c91f"
main = ".open-next/worker.js"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
html_handling = "drop-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "isaudi-staging-db"
database_id = "48ad8f80-6aae-4147-84e5-9f88161401eb"
migrations_dir = "migrations"

[vars]
APP_ENV = "staging"
APP_URL = "https://isaudi-staging.isaudi-official.workers.dev"
BASE_URL = "https://isaudi-staging.isaudi-official.workers.dev"
NEXT_PUBLIC_APP_URL = "https://isaudi-staging.isaudi-official.workers.dev"
RESEND_FROM = "iSaudi Staging <no-reply@updates.isaudi.ai>"
CROSS_STORE_INTELLIGENCE_AI = "shadow"

[observability]
enabled = true
head_sampling_rate = 1.0
redact_query_string = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
